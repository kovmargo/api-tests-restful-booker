name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tests:
        description: "Which tests to run"
        type: choice
        options: [ all, smoke ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
        run: |
          if [ "${{ inputs.tests }}" = "smoke" ]; then
            pytest -v -n 4 -m smoke
          else
            pytest -v -n 4
          fi